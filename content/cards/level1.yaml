# 字伴 v0.1 实验版 · 50 张“救命词”卡片
#
# 内容状态：draft（原型内容，尚未经过 docs/01 的 C5 对抗审校与人工审校）
# 来源策略：
#   - 释义/例句：本原型由项目组用日常口语手写（dict/corpus = self），
#     不冒充词典或真实语料；正式版必须补 source_ref 并走内容流水线。
#   - 图片：项目组手绘 SVG（lib = self，CC BY-SA 4.0），不使用文生图。
#   - 拼音：仅作内部数据与家人查看，不用于教学。
#
# 校验：schema/card.schema.json + scripts/validate-content.mjs
# 顺序：YAML 顺序即“每天三个字”的教学顺序（按场景连续）。

